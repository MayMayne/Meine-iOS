name: Build Unsigned IPA

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "README.md"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          if [ -d "/Applications/Xcode_26.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.app/Contents/Developer
          elif [ -d "/Applications/Xcode_26.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.0.app/Contents/Developer
          elif [ -d "/Applications/Xcode.app" ]; then
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          xcode-select -p
          xcodebuild -version
          xcodebuild -showsdks || true

      - name: Generate project
        run: python3 scripts/gen_xcodeproj.py

      - name: Install iOS platform
        run: |
          set -euo pipefail
          # macos-latest ships the SDK but not the device platform. Archive needs it.
          xcodebuild -downloadPlatform iOS || true
          xcodebuild -showdestinations -project Meine.xcodeproj -scheme Meine || true

      - name: Archive unsigned
        run: |
          set -euo pipefail
          PROJECT_OR_WORKSPACE="-project Meine.xcodeproj"
          SCHEME="Meine"
          SIGNING="CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= DEVELOPMENT_TEAM= CODE_SIGN_ENTITLEMENTS= EXPANDED_CODE_SIGN_IDENTITY="
          EXTRA="ENABLE_PREVIEWS=NO ENABLE_ON_DEMAND_RESOURCES=NO ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOLS=NO ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS=NO SUPPORTED_PLATFORMS=iphoneos IPHONEOS_DEPLOYMENT_TARGET=18.0 COMPILER_INDEX_STORE_ENABLE=NO ENABLE_USER_SCRIPT_SANDBOXING=NO"

          xcodebuild archive \
            $PROJECT_OR_WORKSPACE \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -destination "generic/platform=iOS" \
            -sdk iphoneos \
            $SIGNING \
            $EXTRA

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/export/Payload"
          cp -R "$RUNNER_TEMP/App.xcarchive/Products/Applications/"*.app "$RUNNER_TEMP/export/Payload/"
          cd "$RUNNER_TEMP/export"
          zip -qry App-unsigned.ipa Payload
          ls -lh App-unsigned.ipa
          unzip -l App-unsigned.ipa | head

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error
          retention-days: 14
